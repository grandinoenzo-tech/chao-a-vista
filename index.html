<title>Chão à Vista: a última casa da rua</title>

<meta name="description" content="Chão à Vista: jogo sério de evacuação em caso de inundação para equipes de proteção e defesa civil. Se não vê o chão, não entra. Compatível com WebXR, não testado em headset.">
<meta name="theme-color" content="#0B1F3A">
<style>
:root{--marinho:#0B1F3A;--azul_destaque:#0A3A82;--amarelo:#FFC93C;--laranja:#FF7A1A;--vermelho:#E0344B;--verde:#2E9E4F;--agua:#2B8FA3;--agua_texto:#0E6170;--agua_clara:#D3EEF3;--areia:#E9D8B4;--cartao:#FFFFFF;--branco_suave:#F8FBFF;--tinta:#15202E;--tinta_2:#4A5A6C;--texto_verde_sobre_branco:#23793C;--texto_vermelho_sobre_branco:#B8243A;--texto_laranja_sobre_branco:#B85000;--texto_amarelo_sobre_branco:#8A6400;}
/* Chão à Vista: a última casa da rua — estilo do protótipo.
   Layout: palco 3D à esquerda (no celular, em cima) + painel de decisão à direita (no celular, embaixo);
   faixa marinho no topo com a fase, o nível da escada, o cronômetro e os pontos.
   Visual de um só tema (escuro, fim de tarde chuvoso): os tokens da paleta vêm de DADOS.json
   e são inseridos pelo build antes deste arquivo (--marinho, --amarelo, --agua...). */
:root {
  color-scheme: dark;
  --fundo: var(--marinho);
  --fundo-2: #11294A;          /* marinho um tom acima, para faixas internas */
  --linha: #26446B;            /* divisórias sobre marinho */
  --texto: var(--branco_suave);
  --texto-2: #B9C7D9;          /* texto secundário sobre marinho (contraste 9:1) */
  --cartao-bg: var(--cartao);
  --cartao-tx: var(--tinta);
  --cartao-tx2: var(--tinta_2);
  --foco: var(--amarelo);
  --painel-w: 440px;
  --topo-h: 56px;
  --raio: 10px;
  --fonte: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --fonte-num: Bahnschrift, 'DIN Alternate', 'Segoe UI', system-ui, sans-serif;
  --sombra: 0 6px 24px rgba(0, 0, 0, .35);
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 16px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.chip:empty { display: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -0.22em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; width: 100%; overflow: hidden; }

/* ---------- palco 3D ---------- */
#palco {
  position: absolute; left: 0; top: 0; bottom: 0; right: var(--painel-w);
  background: #59697d; overflow: hidden;
}
#palco a-scene, #palco .a-canvas { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; }
#chuva-css {
  position: absolute; inset: 0; pointer-events: none; opacity: .0; transition: opacity 1.2s;
  background-image:
    repeating-linear-gradient(103deg, rgba(220, 235, 245, .0) 0 9px, rgba(220, 235, 245, .16) 9px 10px, rgba(220, 235, 245, 0) 10px 23px),
    repeating-linear-gradient(101deg, rgba(220, 235, 245, .0) 0 17px, rgba(220, 235, 245, .10) 17px 18px, rgba(220, 235, 245, 0) 18px 41px);
  background-size: 260px 260px, 340px 340px;
  animation: chuva .55s linear infinite;
}
@keyframes chuva { to { background-position: -60px 260px, -70px 340px; } }
#vinheta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(5, 14, 28, .45) 100%); }
#flash { position: absolute; inset: 0; pointer-events: none; background: var(--vermelho); opacity: 0; transition: opacity .25s; }
#rotulos3d { position: absolute; inset: 0; pointer-events: none; }
.r3d {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
  font: 600 13px/1.2 var(--fonte); color: var(--tinta); background: rgba(255, 255, 255, .92);
  padding: 3px 7px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.r3d::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.92); }
.r3d.regua { font: 700 12px/1 var(--fonte-num); padding: 2px 5px; background: var(--marinho); color: var(--branco_suave); transform: translate(6px, -50%); }
.r3d.regua::after { display: none; }
.r3d.seco { background: var(--areia); }

/* legenda do modo demonstração (fica na imagem do vídeo) */
#legenda {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: calc(var(--painel-w) + 16px); bottom: 18px;
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start; pointer-events: none; z-index: 7;
}
/* tamanho pensado para a gravação em 1280x720 ampliada para 1920x1080 (legível no slide projetado) */
#legenda .quem { font: 700 clamp(13px, 1.25vw, 18px)/1 var(--fonte-num); letter-spacing: .08em; text-transform: uppercase; color: var(--marinho); background: var(--amarelo); padding: 6px 10px; border-radius: 6px; }
#legenda .oque { font: 700 clamp(17px, 2.7vw, 40px)/1.2 var(--fonte); color: #fff; background: rgba(11, 31, 58, .9); padding: 10px 16px; border-radius: 8px; max-width: 100%; text-wrap: balance; box-shadow: var(--sombra); }

/* ---------- topo ---------- */
#topo {
  position: absolute; left: 0; right: var(--painel-w); top: 0; min-height: var(--topo-h);
  padding: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: max(8px, env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(180deg, rgba(11, 31, 58, .92), rgba(11, 31, 58, .55) 75%, rgba(11, 31, 58, 0));
  pointer-events: none;
}
#topo > * { pointer-events: auto; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .01em; font-size: 17px; white-space: nowrap; }
.marca svg.ic { color: var(--amarelo); width: 24px; height: 24px; }
.marca small { font-weight: 500; color: var(--texto-2); font-size: 13px; }
#fases { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.fase-pil { font: 600 12px/1 var(--fonte-num); letter-spacing: .04em; padding: 6px 8px; border-radius: 99px; background: rgba(255, 255, 255, .08); color: var(--texto-2); white-space: nowrap; }
.fase-pil.atual { background: var(--branco_suave); color: var(--marinho); }
.fase-pil.feita { color: var(--branco_suave); background: rgba(46, 158, 79, .35); }
.hud-num { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 14px/1 var(--fonte-num); padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,.1); white-space: nowrap; font-variant-numeric: tabular-nums; }
.nivel { color: var(--marinho); }
.nivel[data-n="Sobreaviso"] { background: var(--amarelo); }
.nivel[data-n="Alerta"] { background: var(--laranja); }
.nivel[data-n="Alerta máximo"] { background: var(--vermelho); color: #fff; }
.nivel[data-n=""] { display: none; }

/* ---------- painel ---------- */
#painel {
  position: absolute; right: 0; top: 0; bottom: 0; width: var(--painel-w);
  background: var(--fundo); border-left: 1px solid var(--linha);
  overflow-y: auto; overscroll-behavior: contain;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin; scrollbar-color: var(--linha) transparent;
}
#sobre { scrollbar-width: thin; scrollbar-color: var(--linha) transparent; }
#painel > * { flex-shrink: 0; }
.eyebrow { font: 700 12px/1 var(--fonte-num); letter-spacing: .12em; text-transform: uppercase; color: var(--amarelo); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow .tag { color: var(--texto-2); letter-spacing: .06em; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.situacao { color: var(--texto); font-size: 16px; }
.situacao strong { color: #fff; }
.pergunta { font-size: 19px; font-weight: 800; color: #fff; display: flex; gap: 8px; align-items: flex-start; }
.pergunta svg.ic { color: var(--amarelo); margin-top: 2px; }
.nota { font-size: 12.5px; color: var(--texto-2); }

/* cartão branco (herança C+A) */
.cartao { background: var(--cartao-bg); color: var(--cartao-tx); border-radius: var(--raio); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.cartao .nota { color: var(--cartao-tx2); }
.leitura { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.leitura div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.leitura dt { font: 700 11px/1.1 var(--fonte-num); letter-spacing: .08em; text-transform: uppercase; color: var(--cartao-tx2); display: flex; gap: 5px; align-items: center; }
.leitura dd { margin: 0; font-weight: 700; font-size: 15px; }
.leitura dd.agua { color: var(--agua_texto); }
.vechao { display: flex; gap: 8px; align-items: center; font-weight: 800; color: var(--agua_texto); font-size: 15px; }

/* escala de 3 cores (legenda) */
.escala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.escala > div { border-radius: 8px; padding: 7px 8px; font-size: 12px; line-height: 1.25; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.escala b { font: 800 13px/1 var(--fonte-num); letter-spacing: .04em; display: flex; gap: 4px; align-items: center; }
.cor-verde { background: var(--verde); color: #fff; }
.cor-amarelo { background: var(--amarelo); color: var(--marinho); }
.cor-vermelho { background: var(--vermelho); color: #fff; }

/* opções de decisão */
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.op {
  display: flex; align-items: stretch; gap: 0; width: 100%; min-height: 64px; text-align: left; cursor: pointer;
  background: var(--cartao-bg); color: var(--cartao-tx); border: 0; border-radius: var(--raio); padding: 0; overflow: hidden;
  box-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .12s, box-shadow .12s;
}
.op:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.op:active, .op.toque { transform: scale(.985); }
.op .letra { flex: none; width: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 800 18px/1 var(--fonte-num); background: var(--azul_destaque); color: #fff; }
.op .letra small { font-size: 10px; letter-spacing: .06em; }
.op .txt { padding: 11px 13px; font-size: 15.5px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; min-width: 0; }
.op.agua .letra { width: 96px; font-size: 13px; letter-spacing: .03em; text-align: center; padding: 0 4px; }
.op.agua .letra svg.ic { width: 22px; height: 22px; stroke-width: 3; }
.op .letra.cor-verde { background: var(--verde); color: #fff; }
.op .letra.cor-amarelo { background: var(--amarelo); color: var(--marinho); }
.op .letra.cor-vermelho { background: var(--vermelho); color: #fff; }
.op[disabled] { cursor: default; opacity: .55; transform: none; }
.op.escolhida { opacity: 1; outline: 3px solid var(--amarelo); outline-offset: 2px; }
.op.dedo::after { content: ""; position: absolute; }

/* feedback */
.fb { border-radius: var(--raio); overflow: hidden; background: var(--cartao-bg); color: var(--cartao-tx); }
.fb .cab { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font: 800 16px/1.1 var(--fonte); color: #fff; }
.fb.ok .cab { background: var(--verde); }
.fb.nao .cab { background: var(--vermelho); }
.fb.meio .cab { background: var(--amarelo); color: var(--marinho); }
.fb .cab .pts { margin-left: auto; font-family: var(--fonte-num); }
.fb .corpo { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.fb .corpo .base { font-size: 12.5px; color: var(--cartao-tx2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 12px 18px;
  border: 0; border-radius: var(--raio); cursor: pointer; font-weight: 800; font-size: 16px;
  background: var(--laranja); color: var(--marinho);
}
.btn.sec { background: rgba(255,255,255,.12); color: var(--texto); }
.btn.clara { background: var(--branco_suave); color: var(--marinho); }
.cartao .btn.clara { background: var(--marinho); color: var(--branco_suave); }
.btn.grande { min-height: 64px; font-size: 18px; width: 100%; }
.btn:hover { filter: brightness(1.06); }
.linha-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.linha-btns .btn { flex: 1 1 160px; }

/* cronômetro e régua do córrego (fase Alerta) */
.alerta-box { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: stretch; }
.regua-corrego { width: 54px; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column-reverse; border: 2px solid var(--branco_suave); min-height: 190px; }
.regua-corrego .fx { flex: 1; position: relative; }
.regua-corrego .fx span { position: absolute; left: 3px; top: 3px; font: 700 9px/1 var(--fonte-num); letter-spacing: .02em; }
.regua-corrego .nivel-agua { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(43, 143, 163, .78); border-top: 3px solid #fff; transition: height .4s linear; }
.relogio { font: 700 46px/1 var(--fonte-num); font-variant-numeric: tabular-nums; color: #fff; }
.relogio small { font-size: 14px; color: var(--texto-2); font-weight: 600; display: block; margin-top: 4px; letter-spacing: .02em; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.msg { background: var(--fundo-2); border-left: 4px solid var(--texto-2); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.msg b { font-family: var(--fonte-num); }
.msg.nova { animation: entra .4s ease-out; }
.msg[data-n="Sobreaviso"] { border-left-color: var(--amarelo); }
.msg[data-n="Alerta"] { border-left-color: var(--laranja); }
.msg[data-n="Alerta máximo"] { border-left-color: var(--vermelho); }
@keyframes entra { from { transform: translateY(-6px); opacity: 0; } }

/* ---------- sobreposições: abertura, pré-treino, game over, debriefing ---------- */
#sobre {
  position: absolute; inset: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(90deg, rgba(11, 31, 58, .96) 0%, rgba(11, 31, 58, .90) 42%, rgba(11, 31, 58, .55) 100%);
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#sobre.escuro { background: rgba(8, 20, 38, .94); }
#sobre.vermelho { background: linear-gradient(180deg, rgba(120, 16, 34, .94), rgba(11, 31, 58, .96) 55%); }
.folha { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.folha.larga { max-width: 1120px; }
.abertura { min-height: 100%; display: flex; align-items: center; }
.titulo-jogo { font-size: clamp(38px, 6.4vw, 76px); font-weight: 900; letter-spacing: -.02em; line-height: .98; display: flex; align-items: center; gap: 14px; }
.titulo-jogo svg.ic { color: var(--amarelo); width: .82em; height: .82em; stroke-width: 2.2; }
.subtitulo { font-size: clamp(18px, 2.4vw, 26px); font-weight: 600; color: var(--texto-2); }
.slogan { display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; font: 800 clamp(18px, 2.2vw, 24px)/1.1 var(--fonte); color: var(--marinho); background: var(--amarelo); padding: 10px 14px; border-radius: 8px; }
.apoio { font-size: 17px; max-width: 60ch; }
.rotulos { display: flex; flex-wrap: wrap; gap: 6px; }
.rotulos span { font-size: 12.5px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--linha); color: var(--texto-2); }
.rotulos span.xr { border-color: var(--agua); color: var(--agua_clara); }
.modos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modo { text-align: left; background: var(--cartao-bg); color: var(--cartao-tx); border: 0; border-radius: var(--raio); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 96px; }
.modo b { font-size: 17px; display: flex; gap: 8px; align-items: center; }
.modo span { font-size: 13.5px; color: var(--cartao-tx2); }
.modo.prim { background: var(--laranja); color: var(--marinho); }
.modo.prim span { color: var(--marinho); }
.links-ab { display: flex; flex-wrap: wrap; gap: 10px; }
.cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cards3 .cartao h3 { display: flex; gap: 8px; align-items: center; }
/* ciclo 3: no cartão estreito do pré-treino, as 3 cores ficam uma embaixo da outra (lado a lado, "ESPERA" e "coordenação" saíam cortados em 1920 px) */
.cards3 .escala { grid-template-columns: 1fr; }
.regua-mini { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.regua-mini div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: baseline; }
.regua-mini b { font: 800 18px/1 var(--fonte-num); color: var(--agua_texto); }
/* rótulo do nível da escada no cartão "A equipe também se protege": quebra a linha em vez de cortar ("Alerta máximo") */
.regua-mini .nv { white-space: normal; justify-self: start; max-width: 100%; line-height: 1.1; letter-spacing: 0; overflow-wrap: anywhere; }

.go-cab { display: flex; align-items: center; gap: 12px; }
.go-cab .selo { font: 900 clamp(30px, 5vw, 58px)/1 var(--fonte-num); letter-spacing: .04em; color: #fff; }
.go-cab svg.ic { width: 52px; height: 52px; color: #fff; stroke-width: 2.6; }
.go-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
.go-grid .cartao p { font-size: 15.5px; }
.go-grid .cartao p.grande-num { font: 800 40px/1 var(--fonte-num); color: var(--texto_vermelho_sobre_branco); }

.metricas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.met { background: var(--cartao-bg); color: var(--cartao-tx); border-radius: var(--raio); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.met .v { font: 800 30px/1 var(--fonte-num); font-variant-numeric: tabular-nums; }
.met .v small { font-size: 15px; }
.met .r { font: 700 11px/1.2 var(--fonte-num); letter-spacing: .08em; text-transform: uppercase; color: var(--cartao-tx2); }
.met .d { font-size: 12.5px; color: var(--cartao-tx2); }
.met.alerta .v { color: var(--texto_vermelho_sobre_branco); }
.met.bom .v { color: var(--texto_verde_sobre_branco); }
.deb-cols { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: start; }
.lista-dec { display: flex; flex-direction: column; gap: 0; }
.lista-dec .it { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid #E3E8EF; }
.lista-dec .it:first-child { border-top: 0; }
.lista-dec .it .st { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
.lista-dec .it .st.ok { background: var(--verde); }
.lista-dec .it .st.nao { background: var(--vermelho); }
.lista-dec .it .st svg.ic { width: 15px; height: 15px; stroke-width: 3; }
.lista-dec .it b { display: block; font-size: 14.5px; }
.lista-dec .it span { font-size: 13px; color: var(--cartao-tx2); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; gap: 6px; align-items: center; padding: 7px 10px; border-radius: 99px; font-weight: 700; font-size: 13.5px; background: #EEF2F6; color: var(--cartao-tx2); }
.badge.ganho { background: var(--amarelo); color: var(--marinho); }
.badge:not(.ganho):not(.indisp) { text-decoration: line-through; text-decoration-thickness: 1px; }
.badge.indisp { background: transparent; border: 1px dashed #9AA8B8; }
.badge small { font-weight: 600; font-size: 11.5px; margin-left: 2px; }
.badge small::before { content: "· "; }
.lista-dec .it b .tipo-erro { display: inline-block; margin-left: 6px; font: 800 10.5px/1 var(--fonte-num); letter-spacing: .06em; text-transform: uppercase; font-style: normal; padding: 3px 6px; border-radius: 4px; vertical-align: 1px; }
.tipo-erro.critico { background: var(--vermelho); color: #fff; }
.tipo-erro.sst { background: var(--laranja); color: var(--marinho); }
.deb-resumo { color: var(--texto-2); margin-top: -8px; }
.fb.t35 .cartao-t35 { font-weight: 800; font-size: 16.5px; line-height: 1.3; }
.dxv { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.dxv .faixa { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; }
.dxv .faixa b { font: 800 15px/1 var(--fonte-num); }
table.escada { width: 100%; border-collapse: collapse; font-size: 13px; }
table.escada th, table.escada td { text-align: left; padding: 6px 6px; border-top: 1px solid #E3E8EF; vertical-align: top; }
table.escada th { font: 700 11px/1.2 var(--fonte-num); letter-spacing: .06em; text-transform: uppercase; color: var(--cartao-tx2); border-top: 0; }
.nv { display: inline-block; font: 800 12px/1 var(--fonte-num); padding: 4px 6px; border-radius: 5px; white-space: nowrap; }
.nv.Sobreaviso { background: var(--amarelo); color: var(--marinho); }
.nv.Alerta { background: var(--laranja); color: var(--marinho); }
.nv.Alerta-maximo { background: var(--vermelho); color: #fff; }
textarea#csv { width: 100%; min-height: 110px; font: 12px/1.35 Consolas, 'Cascadia Mono', monospace; background: #F4F7FA; color: var(--tinta); border: 1px solid #CBD5E1; border-radius: 8px; padding: 8px; resize: vertical; }
.rodape-rot { font-size: 12px; color: var(--texto-2); }
.rodape-rot.creditos { color: var(--branco_suave); font-size: 12.5px; }
.rodape-rot + .rodape-rot { margin-top: -10px; }
#btn-vr[hidden] { display: none; }
.ok-msg { font-size: 13px; color: var(--texto_verde_sobre_branco); font-weight: 700; }

#carregando { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--branco_suave); background: var(--marinho); }
#carregando[hidden] { display: none; }

/* modo foto (?ui=0): só a cena, para os renders do vídeo EAD e dos slides */
.sem-ui #topo, .sem-ui #painel, .sem-ui #legenda, .sem-ui #sobre { display: none !important; }
.sem-ui #palco { right: 0 !important; height: 100% !important; max-height: none !important; }
.sem-ui .r3d { font-size: 22px; padding: 5px 11px; }
.sem-ui .r3d.regua { font-size: 20px; padding: 4px 8px; }

/* ---------- celular / janelas estreitas ---------- */
@media (max-width: 860px), (max-aspect-ratio: 1/1) {
  :root { --painel-w: 0px; }
  #palco { right: 0; bottom: auto; height: 40%; min-height: 230px; max-height: 420px; }
  #topo { right: 0; padding-block: max(6px, env(safe-area-inset-top, 0px)) 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 6px; }
  #fases { display: none; }
  .marca { font-size: 15px; }
  .marca small { display: none; }
  .hud-num { margin-left: auto; gap: 5px; }
  .chip { font-size: 13px; padding: 6px 7px; }
  #painel {
    left: 0; right: 0; width: auto; top: clamp(230px, 40%, 420px); bottom: 0; border-left: 0; border-top: 1px solid var(--linha);
    padding-block: 14px max(18px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #legenda { bottom: calc(100% - clamp(230px, 40%, 420px) + 8px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  #sobre:not([hidden]) ~ #legenda { bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
  #legenda .quem { font-size: 11px; padding: 4px 8px; }
  #legenda .oque { font-size: 15px; padding: 7px 10px; }
  .modos, .cards3, .go-grid, .deb-cols { grid-template-columns: 1fr; }
  .metricas { grid-template-columns: 1fr 1fr; }
  #sobre { background: rgba(11, 31, 58, .95); }
  .relogio { font-size: 38px; }
  .op .txt { font-size: 15px; }
  .op.agua .letra { width: 84px; font-size: 12px; }
}
@media (max-width: 380px) {
  .escala { grid-template-columns: 1fr; }
  .leitura { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  #chuva-css { animation: none; }
  .msg.nova { animation: none; }
  .op, .op:hover { transition: none; transform: none; }
}

<script>
/* cena.js — Vila Baru (bairro fictício) feita só com primitivas e cores do A-Frame.
   Nenhum modelo .glb/.gltf, nenhuma textura de arquivo, nenhum a-text: todo texto fica em HTML.
   Expõe window.CENA com: vista(), luz(), chuva(), corrego(), travessia(), ruaAlagada(), sarjeta(),

(function () {
  'use strict';

  // ---------------------------------------------------------------- utilidades
  function ent(pai, geo, mat, pos, rot, id) {
    var e = document.createElement('a-entity');

    (pai || mundo).appendChild(e);

  function grupo(pai, pos, rot, id) { return ent(pai, null, null, pos, rot, id); }

  // ---------------------------------------------------------------- tweens simples
  var tweens = [];

    tweens = tweens.filter(function (t) { return !(t.obj === obj && t.prop === prop); });
    var de = obj[prop];
    if (de && typeof de.clone === 'function') de = de.clone();
    if (REDUZIR) dur = Math.min(dur, 150);

  AFRAME.registerComponent('fluxo', {
    schema: { w: { default: 5 }, d: { default: 6 }, vel: { default: 1.6 }, n: { default: 12 }, cor: { default: '#D3EEF3' }, comp: { default: 0.9 }, galhos: { default: 0 } },
    init: function () {
      this.itens = [];
      var d = this.data;
      for (var i = 0; i < d.n + d.galhos; i++) {
        var galho = i >= d.n;
        var e = galho
          ? ent(this.el, { primitive: 'cylinder', radius: 0.05, height: 0.9, segmentsRadial: 5 }, { color: '#5A3E26' }, null, { x: 90, y: 0, z: 90 * Math.random() })

        var o = { e: e, x: (Math.random() - 0.5) * d.w, z: (Math.random() - 0.5) * d.d, f: 0.7 + Math.random() * 0.6, galho: galho };
        this.itens.push(o);
      }
    },
    tick: function (t, dt) {
      if (!dt || this.el.object3D.visible === false) return;
      var d = this.data, s = Math.min(dt, 60) / 1000;
      for (var i = 0; i < this.itens.length; i++) {
        var o = this.itens[i];
        o.z -= d.vel * o.f * s * (REDUZIR ? 0.3 : 1);
        if (o.z < -d.d / 2) { o.z += d.d; o.x = (Math.random() - 0.5) * d.w; }
        var ob = o.e.object3D;
        ob.position.set(o.x, o.galho ? 0.03 + Math.sin(t / 180 + i) * 0.02 : 0.012, o.z);
        if (o.galho) ob.rotation.y += s * 1.4;
      }
    }
  });

  AFRAME.registerComponent('chuva', {
    schema: { n: { default: 90 }, raio: { default: 8 }, alto: { default: 9 } },
    init: function () {
      this.gotas = [];
      this.centro = v3(10, 0, -6);
      this.ativas = this.data.n;
      for (var i = 0; i < this.data.n; i++) {
        var e = ent(this.el, { primitive: 'box', width: 0.018, height: 0.55, depth: 0.018 }, { color: '#DCE8F2', opacity: 0.55, transparent: true, flatShading: false }, null, { x: 0, y: 0, z: 12 });
        this.gotas.push({ e: e, x: 0, y: Math.random() * this.data.alto, z: 0, v: 9 + Math.random() * 4 });
        this.sortear(this.gotas[i]);
      }
    },
    sortear: function (g) {
      var r = this.data.raio;
      g.x = this.centro.x + (Math.random() - 0.5) * 2 * r;
      g.z = this.centro.z + (Math.random() - 0.5) * 2 * r;
    },
    tick: function (t, dt) {
      if (!dt) return;
      var s = Math.min(dt, 60) / 1000;
      for (var i = 0; i < this.gotas.length; i++) {
        var g = this.gotas[i], ob = g.e.object3D;

        if (!ob.visible) continue;
        g.y -= g.v * s;
        if (g.y < this.centro.y - 1) { g.y = this.centro.y + this.data.alto; this.sortear(g); }
        ob.position.set(g.x - (g.y - this.centro.y) * 0.18, g.y, g.z);
      }
    }
  });

  // atualiza tweens, câmera e rótulos HTML projetados
  var rotulosAtivos = [];
  var rotulosDiv = document.getElementById('rotulos3d');

  AFRAME.registerComponent('diretor', {
    tick: function () {

        var k = Math.min(1, (agora - tw.t0) / tw.dur), e = suave(k);
        if (typeof tw.de === 'number') tw.obj[tw.prop] = tw.de + (tw.para - tw.de) * e;
        else if (tw.de && tw.de.isVector3) tw.obj[tw.prop].lerpVectors(tw.de, tw.para, e);
        else if (tw.de && tw.de.isQuaternion) tw.obj[tw.prop].slerpQuaternions(tw.de, tw.para, e);
        if (k >= 1 && tw.fim) fins.push(tw.fim);
        return k < 1;
      });
      // callbacks depois do filtro: um callback pode criar novos tweens
      for (var f = 0; f < fins.length; f++) fins[f]();
      if (camTween) {
        var k = Math.min(1, (agora - camTween.t0) / camTween.dur), e = suave(k);

        if (k >= 1) camTween = null;
      }
      var cam = cenaEl.camera;
      if (!cam || cenaEl.is('vr-mode')) { rotulosDiv.style.display = 'none'; return; }
      rotulosDiv.style.display = '';
      var w = rotulosDiv.clientWidth, h = rotulosDiv.clientHeight;
      for (var i = 0; i < rotulosAtivos.length; i++) {
        var r = rotulosAtivos[i];
        tmp.copy(r.pos).project(cam);
        var fora = tmp.z > 1 || tmp.z < -1 || tmp.x < -1.05 || tmp.x > 1.05 || tmp.y < -1.05 || tmp.y > 1.05;
        r.div.style.display = fora ? 'none' : '';
        if (!fora) {
          r.div.style.left = ((tmp.x + 1) / 2 * w).toFixed(1) + 'px';
          r.div.style.top = ((1 - tmp.y) / 2 * h).toFixed(1) + 'px';
        }
      }
    }
  });

  // ---------------------------------------------------------------- câmera
  var camTween = null;
  var VISTAS = {
    geral: { p: [17, 9.5, -31], a: [17, 0.5, -3] },
    base: { p: [23.5, 5.0, 19.5], a: [30, 2.8, 9.5] },
    corrego: { p: [1.6, 2.9, -10.6], a: [4.0, -0.55, -17.4] },
    valdir: { p: [1.8, 2.0, -11.6], a: [0.2, 1.0, -5.0] },
    celeste: { p: [22.4, 1.75, -10.6], a: [19.6, 0.85, -5.2] },
    trecho1: { p: [17.2, 2.5, -11.4], a: [24.5, 0.3, -7.2] },
    trecho2: { p: [21.2, 2.7, -12.4], a: [29.2, 0.1, -8.2] },
    trecho3: { p: [38.6, 4.3, 10.2], a: [31.0, 2.3, 6.9] },
    ponto_seco: { p: [30.0, 6.0, -0.2], a: [35.8, 2.6, 11.6] },
    gameover: { p: [22.6, 2.6, -14.2], a: [28.6, 0.0, -10.0] },
    gameover_cima: { p: [35.4, 3.5, 8.9], a: [31.6, 2.4, 7.0] },
    regua: { p: [19.0, 0.8, -7.0], a: [18.25, 0.5, -5.05] }

  function quatOlhando(p, a) {

      dur = 0;
    }
    if (!dur || REDUZIR) { o.position.copy(p1); o.quaternion.copy(q1); camTween = null; }
    else camTween = { p0: o.position.clone(), q0: o.quaternion.clone(), p1: p1, q1: q1, t0: performance.now(), dur: dur };
    // a chuva acompanha o ponto para onde a câmera olha
    var dir = a.clone().sub(p1).normalize();
    var c = p1.clone().add(dir.multiplyScalar(7));
    var ch = document.getElementById('chuva3d');
    if (ch && ch.components.chuva) { ch.components.chuva.centro.set(c.x, Math.min(p1.y, a.y + 1.5) - 0.5, c.z); }

  }

  // ---------------------------------------------------------------- mundo
  var cor = {
    grama: '#6F8C58', grama2: '#5F7D4C', terra: '#6E5A45', lama: '#4E4133', asfalto: '#3D4550',
    calcada: '#A7A69C', muro: '#8D8C84', telhado: '#8E4B3A', telhado2: '#6E5A55', porta: '#4A3326', janela: '#F3D88A'

  function montar() {
    // terreno: margem norte, leito do córrego, baixada (Rua do Córrego) e platô (Rua de Cima)
    caixa(null, 260, 2, 90, cor.grama2, { x: 5, y: -1, z: -63 });

    caixa(null, 260, 2, 19, cor.grama, { x: 5, y: -1, z: -4.5 });
    caixa(null, 260, 3, 90, cor.grama, { x: 5, y: 1.0, z: 50 });

    caixa(null, 74, 0.15, 1.1, cor.calcada, { x: 4, y: 0.075, z: -5.55 });
    caixa(null, 90, 0.02, 4.2, cor.asfalto, { x: 8, y: 2.51, z: 7.6 });
    caixa(null, 90, 0.1, 0.5, cor.calcada, { x: 8, y: 2.55, z: 5.45 });

      var x = -20 + i * 10;
      var g = grupo(null, { x: x, y: 0.15, z: -2 });
      caixa(g, 6, 3, 6, cores[i], { x: 0, y: 1.5, z: 0 });
      ent(g, { primitive: 'cone', radiusBottom: 4.6, radiusTop: 0.01, height: 1.7, segmentsRadial: 4 }, { color: i % 2 ? cor.telhado2 : cor.telhado }, { x: 0, y: 3.85, z: 0 }, { x: 0, y: 45, z: 0 });

      caixa(g, 1.1, 0.9, 0.06, cor.janela, { x: 1.9, y: 1.7, z: -3.02 }, null, { emissive: '#7a5a10', emissiveIntensity: 0.35 });
    }
    // régua pintada no muro da Dona Celeste (cerca de 15, 30 e 60 cm)
    var rm = grupo(null, { x: 18.15, y: 0.15, z: -5.07 });
    caixa(rm, 0.22, 0.8, 0.02, '#FFFFFF', { x: 0, y: 0.4, z: 0 });
    [0.15, 0.30, 0.60].forEach(function (h) { caixa(rm, 0.3, 0.025, 0.03, P.marinho, { x: 0, y: h, z: -0.005 }); });

    caixa(null, 14, 4.6, 7, '#D7CBB0', { x: 40.5, y: 4.8, z: 15.6 });

  function agente() { return { roupa: P.azul_destaque, colete: true, capacete: true, pele: '#B07A57', altura: 1.0, lanterna: true }; }
  function pessoa(pai, pos, rotY, o, id) {
    var a = o.altura || 1;
    var g = grupo(pai, pos, { x: 0, y: rotY || 0, z: 0 }, id);
    var corpo = grupo(g, { x: 0, y: 0, z: 0 });
    corpo.classList.add('corpo');
    caixa(corpo, 0.34 * a, 0.8 * a, 0.22 * a, o.saia ? o.pele : '#2B3440', { x: 0, y: 0.4 * a, z: 0 });
    if (o.saia) ent(corpo, { primitive: 'cone', radiusBottom: 0.33 * a, radiusTop: 0.2 * a, height: 0.62 * a, segmentsRadial: 8 }, { color: o.roupa }, { x: 0, y: 0.62 * a, z: 0 });
    ent(corpo, { primitive: 'cylinder', radius: 0.2 * a, height: 0.62 * a, segmentsRadial: 8 }, { color: o.roupa }, { x: 0, y: 1.12 * a, z: 0 });
    if (o.colete) ent(corpo, { primitive: 'cylinder', radius: 0.235 * a, height: 0.46 * a, segmentsRadial: 8 }, { color: P.laranja, emissive: P.laranja, emissiveIntensity: 0.2 }, { x: 0, y: 1.15 * a, z: 0 });
    caixa(corpo, 0.62 * a, 0.12 * a, 0.12 * a, o.colete ? P.laranja : o.roupa, { x: 0, y: 1.3 * a, z: 0 });
    ent(corpo, { primitive: 'sphere', radius: 0.15 * a, segmentsWidth: 10, segmentsHeight: 8 }, { color: o.pele }, { x: 0, y: 1.6 * a, z: 0 });
    if (o.capacete) ent(corpo, { primitive: 'sphere', radius: 0.17 * a, segmentsWidth: 10, segmentsHeight: 6, thetaLength: 90 }, { color: '#F4F4F0' }, { x: 0, y: 1.63 * a, z: 0 });
    else if (o.cabelo) ent(corpo, { primitive: 'sphere', radius: 0.158 * a, segmentsWidth: 10, segmentsHeight: 6, thetaLength: 80 }, { color: o.cabelo }, { x: 0, y: 1.63 * a, z: 0.01 });
    if (o.bengala) ent(corpo, { primitive: 'cylinder', radius: 0.02, height: 0.9 * a, segmentsRadial: 5 }, { color: '#5B4330' }, { x: 0.36 * a, y: 0.45 * a, z: -0.12 }, { x: 0, y: 0, z: -6 });
    if (o.sacola) caixa(corpo, 0.22, 0.26, 0.1, '#C9A227', { x: -0.36 * a, y: 0.85 * a, z: 0 });
    if (o.lanterna) caixa(corpo, 0.08, 0.08, 0.22, '#FFF6CC', { x: 0.33 * a, y: 1.05 * a, z: -0.15 }, null, { emissive: '#FFF0A8', emissiveIntensity: 1 });
    return g;
  }

  // ---------------------------------------------------------------- estados da cena
  function obj(id) { var e = document.getElementById(id); return e && e.object3D; }
  function mostrar(id, sim) { var o = obj(id); if (o) o.visible = !!sim; }
  var estado = { luz: 0, neblina: 0 };
  function aplicarCeu() {
    var s = cenaEl.object3D;
    var c = misturar('#93A4B6', '#26364D', estado.luz);
    var c2 = c.clone().lerp(new THREE.Color('#B9C3CC'), estado.neblina * 0.5);
    s.background = c2;
    var perto = 22 - estado.neblina * 16, longe = 110 - estado.neblina * 70;
    if (!s.fog) s.fog = new THREE.Fog(c2, perto, longe);
    s.fog.color.copy(c2); s.fog.near = perto; s.fog.far = longe;
  }
  function luz(t) {
    estado.luz = t;
    aplicarCeu();
    var sol = document.getElementById('luz_sol'), ceu = document.getElementById('luz_ceu'), amb = document.getElementById('luz_amb');
    if (sol && sol.getObject3D('light')) sol.getObject3D('light').intensity = 1.5 - 1.05 * t;
    if (ceu && ceu.getObject3D('light')) ceu.getObject3D('light').intensity = 1.7 - 0.8 * t;
    if (amb && amb.getObject3D('light')) amb.getObject3D('light').intensity = 0.55 - 0.15 * t;
  }
  function neblina(t) { estado.neblina = t; aplicarCeu(); }
  function chuva(i) {
    var ch = document.getElementById('chuva3d');
    if (ch && ch.components.chuva) ch.components.chuva.ativas = Math.round(ch.components.chuva.data.n * Math.max(0, Math.min(1, i)));
    var css = document.getElementById('chuva-css');
    if (css) css.style.opacity = String(Math.max(0, Math.min(1, i)) * (REDUZIR ? 0.4 : 0.9));
  }
  function nivelY(id, y, dur) { var o = obj(id); if (o) { o.visible = true; animar(o.position, 'y', y, dur || 1200); } }
  function corrego(y, dur) { nivelY('agua_corrego', y, dur); }
  // profundidade em metros sobre a via (0 = seca)
  function travessia(prof, dur) {
    var o = obj('agua_travessia'); if (!o) return;
    if (prof <= 0) { animar(o.position, 'y', -0.2, dur || 800, function () { o.visible = false; }); return; }
    nivelY('agua_travessia', prof, dur);
  }
  function ruaAlagada(prof, dur) {
    var o = obj('agua_rua'); if (!o) return;
    if (prof <= 0) { animar(o.position, 'y', -0.2, dur || 800, function () { o.visible = false; }); return; }
    nivelY('agua_rua', prof, dur);
  }
  function sarjeta(t, dur) {
    var o = obj('agua_sarjeta'), l = document.getElementById('lamina_cima');
    if (o) { o.visible = t > 0; animar(o.position, 'y', t > 0 ? 2.56 : 2.0, dur || 900); }

<script>
/* jogo.js — Chão à Vista: a última casa da rua.
   Fases (DADOS.json, jogo.fases): 0 Briefing e APR (P2) · 1 Alerta (P1) · 2 Triagem (P2) · 3 Rota (P1)
   · 4 Ponto seco (P2) · 5 Debriefing (P1). Toda fase tem uma decisão de SST pontuada.
   Textos e números de regra vêm de window.DADOS_JOGO (extraído de DADOS.json no build);
   valores de design do jogo (hipotéticos) vêm de window.PARAMS_JOGO (jogo_parametros.json).
   Regras de erro (D3, DADOS.json jogo.especificacao_d3, 18/11/2026):
   - erros críticos (game over explicativo que cita a regra; a fase recomeça): SEGUE na travessia baixa,
     SEGUE na Rua de Cima, mandar a dupla voltar à zona quente no Alerta máximo;
   - erros de SST (contam no debriefing e no CSV, sem game over): sair sozinho / sem dupla; seguir de porta em porta
     ou rumo à travessia depois de T+35 (Alerta máximo), com o cartão do Alerta máximo;
   - medalhas: Pé no seco só com zero erro crítico; Dá meia-volta só com NÃO ENTRA na travessia;
     Ninguém fica para trás só com as duas decisões de triagem corretas. */
(function () {
  'use strict';
  var D = window.DADOS_JOGO, PR = window.PARAMS_JOGO, IC = window.ICONES, BUILD = window.BUILD || {};

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app'), painel = $('#painel'), sobre = $('#sobre'), topo = $('#topo'), legendaEl = $('#legenda');

  // ---------------------------------------------------------------- parâmetros de URL
  var qs = new URLSearchParams(location.search);

  var DEMO = qs.get('demo') === '1' || hash === 'demo' || hash === 'demo-completa';
  var DEMO_COMPLETA = hash === 'demo-completa' || qs.get('completa') === '1';
  var FOTO = qs.get('cena');
  var SEM_UI = qs.get('ui') === '0';
  var VEL = Math.max(0.25, Math.min(4, parseFloat(qs.get('vel')) || 1));
  if (SEM_UI) document.documentElement.classList.add('sem-ui');

  // ---------------------------------------------------------------- utilidades
  function ic(n, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (IC[n] || '') + '</svg>'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function br(n, casas) { return Number(n).toFixed(casas || 0).replace('.', ','); }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms / VEL); }); }
  function agora() { return performance.now(); }
  function idAleatorio() {
    var a = new Uint8Array(6);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 6; i++) a[i] = Math.random() * 256; }
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function dataHora() {
    var d = new Date(), z = -d.getTimezoneOffset(), s = z >= 0 ? '+' : '-', p = function (n) { return ('0' + Math.floor(Math.abs(n))).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + s + p(z / 60) + ':' + p(z % 60);
  }
  function marco(nome) { (window.__marcos = window.__marcos || []).push({ nome: nome, t: Date.now() }); }
  // sigla APR por extenso na 1ª ocorrência de cada tela e de cada cartão de feedback (DADOS.json, siglas.APR).

  var APR = (D.siglas && D.siglas.APR) || { sigla: 'APR', primeira_ocorrencia: 'análise preliminar de risco (APR)' };
  var RE_APR = new RegExp('(^|[^0-9A-Za-zÀ-ÿ(])' + APR.sigla + '(?![0-9A-Za-zÀ-ÿ])');
  function aprPorExtenso(raiz) {
    if (!raiz) return;
    var w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) {
      if (n.parentNode && /^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) continue;
      var t = n.nodeValue, iLonga = t.indexOf(APR.primeira_ocorrencia), m = RE_APR.exec(t);
      var iCurta = m ? m.index + m[1].length : -1;
      if (iLonga >= 0 && (iCurta < 0 || iLonga < iCurta)) return;

  }
  // a mesma troca num texto solto (pílula do topo e legenda da demonstração, ciclo 4): só a 1ª sigla vira a forma longa
  function extenso(t) {
    if (t.indexOf(APR.primeira_ocorrencia) >= 0) return t;

  var celeste = D.personagens.filter(function (p) { return p.id === 'celeste'; })[0];
  var valdir = D.personagens.filter(function (p) { return p.id === 'valdir'; })[0];
  var nws = RC.nws_fema;

  // linha do tempo hipotética do cenário ("T−3 h", "T+15 min"...) convertida em minutos
  var LINHA = D.cenario.linha_do_tempo_hipotetica.map(function (x) {

  var EV_MAXIMO = LINHA.filter(function (x) { return x.nivel === 'Alerta máximo'; })[0] || { t: 'T+' + MIN_MAXIMO + ' min', evento: '' };
  var CARTAO_T35 = ((D3.erros_sst_regras || []).filter(function (r) { return r.id === 'alerta_maximo_t35'; })[0] || {}).cartao ||
    'Alerta máximo: na operação real a equipe já estaria se retirando. Continue para treinar, mas isto conta como erro de SST.';
  var TITULO_ERRO = D3.titulo_debriefing_com_erro || 'Missão concluída com N decisões de SST erradas';
  function nivelNoMin(m) { return m >= MIN_MAXIMO ? 'Alerta máximo' : (m >= MIN_ALERTA ? 'Alerta' : 'Sobreaviso'); }
  function yCorrego(m) {
    var t = PR.nivel_corrego_y;
    if (m <= t[0].min) return t[0].y;
    for (var i = 1; i < t.length; i++) if (m <= t[i].min) { var k = (m - t[i - 1].min) / (t[i].min - t[i - 1].min); return t[i - 1].y + k * (t[i].y - t[i - 1].y); }
    return t[t.length - 1].y;
  }
  function faixaDoY(y) { var f = PR.faixas_regua_corrego; for (var i = f.length - 1; i >= 0; i--) if (y >= f[i].de) return f[i]; return f[0]; }

  // ---------------------------------------------------------------- estado da partida
  var S;
  function novoEstado(modo) {
    S = {
      sessao: idAleatorio(), modo: modo, inicio: agora(), pontos: 0, eventos: [], erros: 0, sstOk: 0, sstTot: 0,
      tAlerta0: null, tDecisao: null, minDecisao: null, rota: '', gameOver: '', gameOvers: [], tardio: false, forcado: false,
      pipocaJunto: true, meiaVolta: false, contagemOk: false, nivel: '', relogio: '', fase: null, pct: null,
      errosSst: 0, triagem: { valdir: null, recusa: null }, t35: {}, minAtual: 0
    };
  }
  // tipo: '' (decisão comum) | 'critico' (erro crítico, game over) | 'sst' (erro de SST, sem game over)
  function registrar(fase, decisao, correta, pts, texto, tipo) {
    S.eventos.push({ data_hora: dataHora(), fase: fase, decisao: decisao, correta: !!correta, texto: texto || decisao, tipo: tipo || '' });
    S.sstTot++;
    if (tipo === 'critico') S.erros++;
    if (tipo === 'sst') S.errosSst++;
    if (correta) { S.sstOk++; S.pontos += (pts === undefined ? J.pontuacao_proposta.por_decisao_sst_correta : pts); }
    hud();
  }
  function gameOverMotivo(txt) { S.gameOvers.push(txt); S.gameOver = S.gameOvers.join(' | '); }

  // ---------------------------------------------------------------- HUD (topo)
  var FASES = J.fases;
  function fasesDoModo(m) { return FASES.filter(function (f) { return m === 'completa' || f.prioridade === 'P1'; }); }
  // Ciclo 4 (B1, 18/11/2026): a pílula do topo não mostra a sigla APR sozinha antes da forma longa do eyebrow.
  // Opção B: a pílula da Fase 0 fica "Briefing", com title e aria-label "Fase 0 · Briefing e análise preliminar de risco (APR)".
  // (A opção A, a pílula por extenso, foi medida e reprovada: o #topo não fica numa linha só de 861 a 1600 px.)
  // Só a exibição muda: jogo.fases (DADOS.json), o eyebrow, o debriefing e a coluna fase do CSV continuam com o nome do DADOS.
  function pilula(f) {
    var m = RE_APR.exec(f.nome);
    if (!m) return { txt: f.nome };
    var i = m.index + m[1].length, depois = f.nome.slice(i + APR.sigla.length);
    var curto = (f.nome.slice(0, i).replace(/\s+(e|,|·)?\s*$/, '') + depois).trim();

    }).join('');

    $('#hud-relogio').innerHTML = S.relogio ? ic('clock') + esc(S.relogio) : '';
    $('#hud-relogio').hidden = !S.relogio;

  }
  function nivel(n, relogio) { S.nivel = n; if (relogio !== undefined) S.relogio = relogio; hud(); }

  var SEM_LEGENDA = qs.get('legenda') === '0';
  function legenda(quem, oque) {

  }
  var QUEM = 'Modo demonstração · quem joga: agente de evacuação (simulado)';

  // ---------------------------------------------------------------- painel de decisão
  function escalaHTML() {
    return '<div class="escala" aria-label="Escala de 3 cores">' + ['verde', 'amarelo', 'vermelho'].map(function (c) {
      var e = esc3[c], icn = e.icone === 'x' ? 'x' : e.icone;

    }).join('') + '</div>';
  }
  function leituraHTML(t) {
    return '<div class="cartao"><div class="vechao">' + ic('eye') + esc(D.marca.pergunta_bordao) + ' Leia a água antes de decidir</div>' +
      '<dl class="leitura">' +

      '<div><dt>' + ic('eye') + 'Chão</dt><dd>' + esc(t.chao) + '</dd></div>' +
      '<div><dt>' + ic('cloud-rain') + 'Chuva</dt><dd>' + esc(t.chuva) + '</dd></div>' +
      '</dl></div>';
  }

  function feedback(tipo, titulo, corpo, base, pts, rotuloBtn) {

  // cartão do Alerta máximo (erro de SST, sem game over): seguir na zona quente depois de T+35. Conta uma vez por situação.

    mostradas[0] = mostradas[1] = true;
    var cb = D.fontes_de_alerta_df[1];
    var resolverDecisao;
    var promessa = new Promise(function (r) { resolverDecisao = r; });
    function atualizar() {
      var y = yCorrego(min), fx = faixaDoY(y), nv = nivelNoMin(min);
      $('#rel').firstChild.nodeValue = 'T+' + Math.floor(min) + ' min';
      $('#rel2').textContent = 'tempo real: ' + br((agora() - t0) / 1000, 0) + ' s';
      var el = $('#nv-alerta'); el.dataset.n = nv; el.textContent = nv;

      $('#faixa-txt').textContent = 'Régua do córrego na faixa ' + fx.nome + ' (faixas hipotéticas do cenário).';
      nivel(nv, 'T+' + Math.floor(min) + ' min');
      CENA.corrego(y, 250);
      CENA.chuva(0.5 + 0.45 * Math.min(1, min / MIN_MAXIMO));
      CENA.luz(0.2 + 0.25 * Math.min(1, min / MIN_MAXIMO));
      LINHA.forEach(function (x, i) {
        if (!mostradas[i] && x.min >= 0 && min >= x.min && x.min <= MIN_MAXIMO) {
          mostradas[i] = true;
          msg(x.nivel, x.t, esc(x.evento) + (x.nivel === 'Alerta' ? '.' : ''));
          if (x.nivel === 'Alerta') msg('Alerta', x.t, 'O celular da ' + esc(celeste.nome) + ' é antigo (anterior a 2020): ela não recebe o cell broadcast. Alguém precisa bater à porta.');
        }
      });
    }
    var timer = setInterval(function () {
      if (decidido) return;
      var t = agora();
      if (!document.hidden && !document.querySelector('a-scene').is('vr-mode')) min += (t - tUltimo) / 1000 / sPorMin;
      tUltimo = t;
      if (min >= PR.decisao_forcada_min) { min = PR.decisao_forcada_min; atualizar(); decidir(true); return; }
      atualizar();
      if (DEMO && min >= PR.demo.decide_evacuar_no_min) decidir(false);
    }, 100);
    function decidir(forcado) {
      if (decidido) return; decidido = true; clearInterval(timer);
      painel.querySelectorAll('.btn').forEach(function (b) { b.disabled = true; });
      resolverDecisao(forcado);
    }
    $('#b-evacuar').onclick = function () { decidir(false); };

    resolverAtual = null;
    atualizar();
    var forcado = await promessa;

    registrar(f.nome, 'iniciar_evacuacao (T+' + S.minDecisao + ' min' + (forcado ? ', ordem da coordenação' : '') + ')', noPrazo, undefined,
      'Quando evacuar: ' + (forcado ? 'ordem da coordenação' : 'evacuação iniciada') + ' em T+' + S.minDecisao + ' min (' + nivelNoMin(min) + ')');
    legenda(QUEM, 'Decide: iniciar a evacuação em T+' + S.minDecisao + ' min (nível ' + nvDec + ')');

    painel.scrollTop = 0;

    else if (noPrazo && min < MIN_ALERTA) txt = 'Você decidiu antes do nível Alerta. Na cheia rápida, evacuar cedo elimina a exposição: é o primeiro nível da hierarquia de controle (eliminação).';

  async function faseRota(f) {
    S.fase = f;
    var TC = PR.tempo_cenario;
    var m = (S.minDecisao || 16) + (S.modo === 'completa' || (DEMO && DEMO_COMPLETA) ? TC.rota_apos_decisao_min.completa : TC.rota_apos_decisao_min.rapida);
    var tentativa = 0;
    CENA.mostrar('celeste_casa', false); CENA.mostrar('pipoca_casa', false); CENA.mostrar('dupla', false);
    while (true) {
      tentativa++;
      CENA.arrastar(false);
      var motivo = await percorrer(f, m, tentativa);
      if (!motivo) break;
      await telaGameOver(f, motivo);
    }
    // pós-rota: Ponto Seco à vista
    CENA.sarjeta(0); CENA.neblina(0);
  }
  // devolve '' quando a comitiva chega ao Ponto Seco, ou o motivo do erro crítico ('travessia' | 'rua_de_cima')
  async function percorrer(f, m, tentativa) {
    var T = PR.trechos, passo = PR.tempo_cenario.trecho_passo_min;
    for (var i = 0; i < T.length; i++) {
      var t = T[i], mt = m + i * passo;
      S.minAtual = mt;
      nivel(nivelNoMin(mt), 'T+' + mt + ' min');
      CENA.comitivaEm(t.comitiva, t.rot);
      CENA.vista(t.vista, i === 0 && tentativa === 1 ? 1800 : 1300);
      CENA.corrego(yCorrego(mt));
      if (t.id === 'calcada') { CENA.luz(0.55); CENA.chuva(0.6); CENA.travessia(0.2, 10); CENA.sarjeta(0, 10); CENA.neblina(0); CENA.rotulos(['rua_corrego', 'travessia']); }
      if (t.id === 'travessia') { CENA.luz(0.6); CENA.chuva(0.85); CENA.travessia((t.profundidade_cm || 20) / 100, 600); CENA.rotulos(['travessia', 't15', 't30', 't60']); }
      if (t.id === 'rua_de_cima') { CENA.luz(0.66); CENA.chuva(1); CENA.sarjeta(1); CENA.neblina(0.7); CENA.rotulos(['rua_cima', 'ponto_seco']); }
      var cap = {
        calcada: 'Trecho 1: chão visível e sem correnteza → SEGUE',
        travessia: tentativa === 1 ? 'Erro proposital: segue pela travessia com água correndo' : 'Refaz: na travessia, NÃO ENTRA → muda de rota e avisa a coordenação',
        rua_de_cima: 'Trecho 3: chuva forte e chão pouco visível → ESPERA em ponto seguro'
      }[t.id];
      legenda(QUEM, 'Missão Rota · ' + (DEMO ? cap : t.nome));
      // depois de T+35 (Alerta máximo), seguir pela Rua do Córrego rumo à travessia conta como erro de SST (cartão, sem game over)
      if (t.zona_quente) {
        await cartaoAlertaMaximo(f, 'rota_zona_quente', mt, 'A comitiva ainda está na Rua do Córrego, a caminho da travessia baixa.',
          'seguiu pela Rua do Córrego rumo à travessia baixa');
        legenda(QUEM, 'Missão Rota · ' + (DEMO ? cap : t.nome));
      }
      var intro = i === 0 ? (S.modo === 'rapida' || (DEMO && !DEMO_COMPLETA) ? 'A dupla chegou à última casa da rua: a ' + esc(celeste.nome) + ' e o Pipoca vão junto até o Ponto Seco. ' : 'A ' + esc(celeste.nome) + ' e o Pipoca seguem com a dupla. ') : '';
      var op = await escolher({
        chave: t.id, demo: roteiro(t.id, tentativa), agua: true,
        eyebrow: 'Fase ' + f.id + ' · ' + f.nome + ' · trecho ' + (i + 1) + ' de ' + T.length, tag: tentativa > 1 ? 'nova tentativa' : 'sigo, espero ou mudo de rota?',
        titulo: t.nome,
        situacao: intro + 'Leia a água e escolha pela escala.',
        extra: leituraHTML(t),
        pergunta: 'Sigo, espero ou mudo de rota?',
        opcoes: [
          { id: 'segue', cor: 'verde', txt: t.txt_segue },
          { id: 'espera', cor: 'amarelo', txt: t.txt_espera },
          { id: 'nao', cor: 'vermelho', txt: t.txt_nao }
        ]
      });
      var certo = { verde: 'segue', amarelo: 'espera', vermelho: 'nao' }[t.cor];
      var correta = op.id === certo;
      var pts = correta ? J.pontuacao_proposta.por_decisao_sst_correta : 0;
      if (t.id === 'travessia') {
        S.rota = op.id === 'segue' ? 'travessia_baixa' : (op.id === 'nao' ? 'rota_alta' : 'espera');
        // medalha "Dá meia-volta": só com NÃO ENTRA na travessia (vale a escolha da rota que chegou ao Ponto Seco)
        S.meiaVolta = op.id === 'nao';
      }
      if (op.id === 'segue' && t.segue_critico) {
        // erro crítico: SEGUE com água em movimento (travessia) ou sem ver o chão (Rua de Cima) → game over explicativo
        if (t.id === 'travessia') {
          gameOverMotivo('entrou em água em movimento na ' + t.nome.toLowerCase() + ' (' + t.profundidade + ', chão ' + t.chao + ')');
          registrar(f.nome, t.id + ':segue (ERRO CRÍTICO)', false, undefined, 'Erro crítico · ' + t.nome + ': SEGUE, entrou em água em movimento (game over)', 'critico');
          legenda(QUEM, 'Erro crítico: o agente entra na água em movimento e é arrastado');
          CENA.vista('gameover', 900); CENA.arrastar(true); CENA.flash();
        } else {
          gameOverMotivo('desceu a ' + t.nome.split(',')[0] + ' sem ver o chão (correnteza ' + t.correnteza + ', chão ' + t.chao + ')');
          registrar(f.nome, t.id + ':segue (ERRO CRÍTICO)', false, undefined, 'Erro crítico · ' + t.nome + ': SEGUE, desceu sem ver o chão (game over)', 'critico');
          legenda(QUEM, 'Erro crítico: o agente desce sem ver o chão e cai na correnteza da sarjeta');
          CENA.vista('gameover_cima', 900); CENA.cair(true); CENA.flash();
        }
        await espera(2300);
        return t.id;
      }
      registrar(f.nome, t.id + ':' + op.id, correta, undefined, t.nome + ': ' + esc3[op.cor].palavra + ' (' + op.txt + ')');
      var fb = textoTrecho(t, op.id, correta);
      if (t.id === 'travessia' && DEMO) legenda(QUEM, 'Refaz: NÃO ENTRA. Muda de rota pela Rua de Cima e avisa a coordenação');
      if (t.id === 'rua_de_cima' && op.id === 'espera') {
        legenda(QUEM, DEMO ? 'Espera em ponto seguro: a pancada passa e o chão volta a aparecer' : 'Missão Rota · espera em ponto seguro');
        CENA.chuva(0.5); CENA.sarjeta(0, 2200); CENA.neblina(0);
      }
      await feedback(correta ? 'ok' : 'meio', correta ? 'Correto: ' + esc3[t.cor].palavra : 'Não era a melhor leitura', fb.txt, fb.base, pts);
      if (t.id === 'travessia') {
        // segue pela rota alta: sobe a ladeira para a Rua de Cima
        CENA.comitivaEm([15, 1.4, 0], 180, 900);
      }
    }
    return '';
  }

  function calcularEvacuados() {
    var total = 0, ok = 0, lista = [];
    PR.populacao.forEach(function (p) {
      var n = p.pessoas + p.animais, chegou = true;
      if (p.perde_se_decisao_tardia && S.tardio) chegou = false;
      if (p.id === 'pipoca' && !S.pipocaJunto) chegou = false;
      total += n; if (chegou) ok += n;
      lista.push({ nome: p.nome, n: n, chegou: chegou, animal: p.animais > 0 });
    });
    S.pct = Math.round(ok / total * 100);
    S.evacLista = lista; S.evacTotal = total; S.evacOk = ok;
    return lista;
  }

          { id: 'b', correta: false, critico: true, txt: 'Uma dupla volta rápido à Rua do Córrego para bater de novo na casa ' + PR.casa_sem_resposta },
          { id: 'c', correta: false, txt: 'Cada agente vai para casa; a contagem de efetivo fica para amanhã',
            fb: 'Sem contagem de efetivo, ninguém sabe se falta alguém da equipe. A retirada é para o ponto seguro predefinido, com contagem.' }
        ]
      });
      if (!op.critico) break;
      // erro crítico: voltar à zona quente no Alerta máximo → game over explicativo e a fase recomeça
      gameOverMotivo('mandou a dupla de volta à zona quente no Alerta máximo (casa ' + PR.casa_sem_resposta + ', T+' + m + ' min)');
      legenda(QUEM, 'Erro crítico: a dupla volta à zona quente no Alerta máximo');
      CENA.mostrar('equipe', false);
      CENA.duplaEm(PR.dupla_zona_quente.pos, PR.dupla_zona_quente.rot);
      CENA.vista('gameover', 900); CENA.ruaAlagada(0.12, 10); CENA.travessia(0.35, 10); CENA.flash();
      await espera(2300);
      await telaGameOver(f, 'zona_quente');
    }
    CENA.duplaEm(null); CENA.mostrar('dupla', false);
  }

  // ---------------------------------------------------------------- debriefing
  function missaoCompleta() { return S.modo === 'completa' || (S.modo === 'demo' && DEMO_COMPLETA); }
  // medalhas (D3): disponivel = a partida tem a fase que a medalha avalia (triagem e ponto seco só na missão completa)
  function medalhas() {
    var comp = missaoCompleta();
    return J.badges.map(function (b) {
      var disp = true, ganho = false;
      if (b.id === 'pe_no_seco') ganho = S.erros === 0;
      else if (b.id === 'da_meia_volta') ganho = !!S.meiaVolta;
      else if (b.id === 'ninguem_fica') { disp = comp; ganho = comp && S.triagem.valdir === true && S.triagem.recusa === true && S.pct === 100; }
      else if (b.id === 'contagem_fechada') { disp = comp; ganho = comp && !!S.contagemOk; }
      return { id: b.id, nome: b.nome, criterio: b.criterio, disp: disp, ganho: ganho };
    });
  }
  function badgesGanhos() {
    return medalhas().filter(function (x) { return x.ganho; }).map(function (x) { return x.nome; });
  }
  function contagemErros() {
    var erradas = S.eventos.filter(function (e) { return !e.correta; }).length;
    return { erradas: erradas, criticos: S.erros, sst: S.errosSst, outras: Math.max(0, erradas - S.erros - S.errosSst) };
  }
  function tituloDebriefing() {
    var n = contagemErros().erradas;
    if (n === 0) return 'Missão cumprida sem ninguém na água.';
    if (n === 1) return TITULO_ERRO.replace(/\bN decisões de SST erradas\b/, '1 decisão de SST errada').replace(/\bN\b/, '1');
    return TITULO_ERRO.replace(/\bN\b/, String(n));
  }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }
  function csv() {
    var cols = J.csv_colunas;
    var tTotal = (agora() - S.inicio) / 1000;
    var tDec = S.tDecisao && S.tAlerta0 ? (S.tDecisao - S.tAlerta0) / 1000 : '';
    var resumo = {
      sessao_id: S.sessao, modo: S.modoCsv, tempo_ate_decisao_s: tDec === '' ? '' : br(tDec, 1), erros_criticos: S.erros, pct_evacuados: S.pct,
      decisoes_sst_corretas: S.sstOk, decisoes_sst_total: S.sstTot, tempo_total_s: br(tTotal, 1), rota_escolhida: S.rota,
      game_over_motivo: S.gameOver, badges: S.badges.join(' | ')
    };
    var linhas = S.eventos.map(function (e) {
      return Object.assign({}, resumo, { data_hora: e.data_hora, fase: e.fase, decisao: e.decisao, correta: e.correta ? 'sim' : 'nao' });
    });
    // linha de resumo: contagem dos erros pelo tipo da regra D3 (as colunas do CSV são as de DADOS.json)
    var cnt = contagemErros();
    linhas.push(Object.assign({}, resumo, { data_hora: dataHora(), fase: 'resumo',
      decisao: 'erros_criticos=' + cnt.criticos + ' | erros_sst=' + cnt.sst + ' | decisoes_sst_erradas=' + cnt.erradas, correta: '' }));
    function cel(v) { v = v === undefined || v === null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    return cols.join(';') + '\r\n' + linhas.map(function (l) { return cols.map(function (c) { return cel(l[c]); }).join(';'); }).join('\r\n') + '\r\n';
  }
  async function faseDebriefing(f) {
    S.fase = f; hud();
    if (S.pct === null) calcularEvacuados();
    S.badges = badgesGanhos();
    S.modoCsv = DEMO ? 'demo' : S.modo;
    nivel('', '');
    CENA.vista('geral', 2000); CENA.luz(0.85); CENA.chuva(0.5); CENA.ruaAlagada(0.12); CENA.travessia(0.35);
    CENA.mostrar('comitiva', false); CENA.mostrar('moradores_ps', true); CENA.mostrar('equipe', true);
    CENA.rotulos(['corrego', 'travessia', 'ponto_seco', 'rua_cima']);
    legenda(QUEM, 'Debriefing: tempo até a decisão, erros críticos, % evacuados, decisões de SST e CSV');
    marco('debriefing');
    var tTotal = (agora() - S.inicio) / 1000;
    var tDec = S.tDecisao ? (S.tDecisao - S.tAlerta0) / 1000 : 0;
    var texto = csv();
    var rotaNome = { rota_alta: 'Rua de Cima (rota alta, seca)', travessia_baixa: 'travessia baixa (com água)', espera: 'espera na beira, depois Rua de Cima' }[S.rota] || S.rota;
    var dx = RC.dxv_aidr;
    var cnt = contagemErros(), MED = medalhas();
    var medDisp = MED.filter(function (x) { return x.disp; });
    var resumoErros = cnt.erradas === 0 ? 'Nenhuma decisão de SST errada: zero erro crítico e zero erro de SST.' :
      plural(cnt.criticos, 'erro crítico', 'erros críticos') + ' (game over e a fase recomeçou) · ' + plural(cnt.sst, 'erro de SST', 'erros de SST') +
      ' (sem game over) · ' + plural(cnt.outras, 'outra decisão errada', 'outras decisões erradas') + '.';
    abrirSobre(
      '<div class="folha larga">' +
      '<div class="eyebrow">' + ic('clipboard-list') + ' Fase ' + f.id + ' · Debriefing<span class="tag">sessão ' + esc(S.sessao) + (DEMO ? ' · demonstração' : '') + '</span></div>' +
      '<h2 id="deb-titulo">' + esc(tituloDebriefing()) + '</h2>' +
      '<p class="situacao deb-resumo">' + esc(resumoErros) + '</p>' +
      '<div class="metricas">' +
      met('Tempo até a decisão', br(tDec, 1) + '<small> s</small>', 'evacuação decidida em T+' + S.minDecisao + ' min (' + nivelNoMin(S.minDecisao) + ')', S.tardio ? 'alerta' : 'bom') +
      met('Erros críticos', String(cnt.criticos), 'SEGUE na água em movimento ou sem ver o chão; volta à zona quente no Alerta máximo', cnt.criticos ? 'alerta' : 'bom') +
      met('Erros de SST', String(cnt.sst), 'sair sem dupla; seguir na zona quente depois de T+' + MIN_MAXIMO + ' (sem game over)', cnt.sst ? 'alerta' : 'bom') +
      met('Decisões de SST', S.sstOk + '<small>/' + S.sstTot + '</small>', 'corretas / avaliadas, contando as tentativas refeitas', S.sstOk === S.sstTot ? 'bom' : 'alerta') +
      met('Evacuados', S.pct + '<small>%</small>', S.evacOk + ' de ' + S.evacTotal + ' (pessoas e animal) no Ponto Seco', S.pct === 100 ? 'bom' : 'alerta') +
      met('Rota escolhida', '<span style="font-size:17px">' + esc(rotaNome) + '</span>', 'na travessia baixa', S.rota === 'rota_alta' ? 'bom' : 'alerta') +
      met('Tempo total', Math.floor(tTotal / 60) + ':' + ('0' + Math.floor(tTotal % 60)).slice(-2), 'duração da partida', '') +
      met('Pontos', String(S.pontos + S.evacOkPts()), 'decisões + evacuados (valores de design do jogo)', '') +
      '</div>' +
      '<div class="cartao"><h3>' + ic('award') + ' Medalhas · ' + S.badges.length + ' de ' + medDisp.length + (medDisp.length < MED.length ? ' possíveis nesta missão' : '') + '</h3><div class="badges">' + MED.map(function (x) {
        var cls = x.ganho ? ' ganho' : (x.disp ? '' : ' indisp');
        var est = x.ganho ? 'ganha' : (x.disp ? 'não ganha' : 'só na missão completa');
        return '<span class="badge' + cls + '" data-id="' + esc(x.id) + '" title="' + esc(x.criterio) + '">' + ic(x.ganho ? 'badge-check' : (x.disp ? 'x' : 'info')) + esc(x.nome) +
          (x.disp ? '' : '<small>só na missão completa</small>') + '<span class="sr">' + est + '</span></span>';
      }).join('') + '</div><p class="nota">' + MED.map(function (x) { return x.nome + ': ' + x.criterio; }).join(' · ') + '</p></div>' +
      '<div class="deb-cols">' +
      '<div class="cartao"><h3>' + ic('shield-check') + ' Suas decisões de SST</h3><div class="lista-dec">' + S.eventos.map(function (e) {
        var rot = e.tipo === 'critico' ? '<em class="tipo-erro critico">erro crítico</em>' : (e.tipo === 'sst' ? '<em class="tipo-erro sst">erro de SST</em>' : '');
        return '<div class="it"><span class="st ' + (e.correta ? 'ok' : 'nao') + '">' + ic(e.correta ? 'check' : 'x') + '</span><div><b>' + esc(e.fase) + rot + '</b><span>' + esc(e.texto) + '</span></div></div>';
      }).join('') + '</div>' + (S.gameOvers.length ? '<p class="nota">Game over: ' + esc(S.gameOvers.join('; ')) + '.</p>' : '') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0">' +
      '<div class="cartao"><h3>' + ic('waves') + ' Margem de segurança (D×V, só no debriefing)</h3><div class="dxv">' +
      '<div class="faixa"><b>&lt; ' + br(dx.adulto_risco_baixo_abaixo_m2s, 1) + ' m²/s</b><span>risco baixo para adulto</span></div>' +
      '<div class="faixa"><b>' + br(dx.limite_socorrista_treinado_m2s, 1) + ' m²/s</b><span>limite de trabalho recomendado para adultos treinados</span></div>' +
      '<div class="faixa"><b>&gt; ' + br(dx.risco_extremo_acima_m2s, 1) + ' m²/s</b><span>«' + esc(dx.termo_da_fonte) + '» (AIDR)</span></div>' +
      '<p class="nota">D×V = profundidade × velocidade da água. ' + esc(dx.ressalva) + ' ' + esc(dx.decisao_do_curso) + ' No campo ninguém mede a velocidade da água: por isso a regra da equipe é a da vista. ' + esc(RC.frase) + '</p></div></div>' +
      '<div class="cartao"><h3>' + ic('siren') + ' Escada alerta → ação</h3><div style="overflow-x:auto"><table class="escada"><thead><tr><th>Nível</th><th>População</th><th>SST da equipe</th></tr></thead><tbody>' +
      ESC.map(function (e) { return '<tr><td><span class="nv ' + e.nivel.replace(' máximo', '-maximo') + '">' + esc(e.nivel) + '</span></td><td>' + esc(e.acao_populacao) + '</td><td>' + esc(e.acao_sst_equipe) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="nota">' + esc(ROT.escada) + '.</p></div>' +
      '</div></div>' +
      '<div class="cartao"><h3>' + ic('download') + ' Registro da sessão (CSV)</h3>' +
      '<p class="nota">' + esc(J.csv_privacidade) + ' Colunas: ' + esc(J.csv_colunas.join(', ')) + '. Separador ponto e vírgula, UTF-8.</p>' +
      '<div class="linha-btns">' + (BUILD.alvo === 'artifact' ? '' : '<button class="btn clara" id="b-baixar">' + ic('download') + 'Baixar CSV</button>') +
      '<button class="btn clara" id="b-copiar">' + ic('copy') + 'Copiar CSV</button></div><span class="ok-msg" id="csv-ok" role="status"></span>' +
      '<label class="sr" for="csv">Conteúdo do CSV</label><textarea id="csv" readonly>' + esc(texto) + '</textarea>' +
      '<p class="nota">Ranking ' + esc(J.ranking) + ': ' + esc(ROT.proposto.toLowerCase()) + '.</p></div>' +
      '<div class="linha-btns"><button class="btn grande" id="b-denovo">' + ic('rotate-ccw') + 'Jogar de novo</button>' +
      '<button class="btn sec grande" id="b-inicio">' + ic('house') + 'Voltar ao início</button></div>' +
      rotulosHTML() + creditosHTML() +
      '</div>', 'escuro');
    painel.innerHTML = '';
    var bb = $('#b-baixar');
    /*BAIXAR_INICIO*/
    if (bb) bb.onclick = function () {
      try {
        var blob = new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'chao_a_vista_sessao_' + S.sessao + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        $('#csv-ok').textContent = 'Arquivo gerado: ' + a.download;
      } catch (e) { $('#csv-ok').textContent = 'O navegador bloqueou o download; use Copiar CSV.'; }
    };
    /*BAIXAR_FIM*/
    $('#b-copiar').onclick = function () {
      var ta = $('#csv');
      function manual() { ta.focus(); ta.select(); $('#csv-ok').textContent = 'Texto selecionado: use Ctrl+C.'; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(function () { $('#csv-ok').textContent = 'CSV copiado.'; }, manual);
      else manual();
    };
    $('#b-denovo').onclick = function () { var m = S.modo === 'demo' ? 'rapida' : S.modo; sairDemo(); preTreino(m); };
    $('#b-inicio').onclick = function () { sairDemo(); fecharSobre(); telaAbertura(); };
    window.__csv = texto;
    if (DEMO) {
      await espera(PR.demo.debriefing_ms * 0.55);
      var alvo = sobre.querySelector('.deb-cols');
      if (alvo) sobre.scrollTo({ top: alvo.offsetTop - 20, behavior: 'smooth' });
      await espera(PR.demo.debriefing_ms * 0.45);
      marco('fim_demo');
    }
  }
  function met(rot, v, d, cls) { return '<div class="met ' + (cls || '') + '"><span class="r">' + esc(rot) + '</span><span class="v">' + v + '</span><span class="d">' + esc(d) + '</span></div>'; }

  // ---------------------------------------------------------------- partida
  var RODAR = { 0: faseBriefing, 1: faseAlerta, 2: faseTriagem, 3: faseRota, 4: fasePontoSeco, 5: faseDebriefing };
  function roteiro(chave, tentativa) {
    var r = DEMO_COMPLETA ? PR.demo.roteiro_completo : PR.demo.roteiro_rapido;
    var v = r[chave];
    if (Array.isArray(v)) return v[Math.min(v.length, tentativa || 1) - 1];
    return v || 'a';
  }
  async function jogar(modo) {
    fecharSobre();
    novoEstado(modo);
    window.__estado = S; // só leitura, para os testes automáticos
    S.evacOkPts = function () {
      if (S.pct === null) return 0;
      var p = 0; (S.evacLista || []).forEach(function (x) { if (x.chegou) p += x.animal ? J.pontuacao_proposta.por_animal_evacuado * x.n : J.pontuacao_proposta.por_morador_evacuado * x.n; });
      return p;
    };
    CENA.mostrar('celeste_casa', true); CENA.mostrar('pipoca_casa', true); CENA.mostrar('comitiva', false); CENA.mostrar('moradores_ps', false);
    CENA.travessia(0); CENA.ruaAlagada(0); CENA.sarjeta(0); CENA.neblina(0);
    var lista = fasesDoModo(modo === 'demo' ? (DEMO_COMPLETA ? 'completa' : 'rapida') : modo);
    for (var i = 0; i < lista.length; i++) await RODAR[lista[i].id](lista[i]);
  }

  // ---------------------------------------------------------------- VR (só se o navegador confirmar)
  function configurarVR() {
    var b = $('#btn-vr'), bt = $('#hud-vr');
    if (!navigator.xr || !navigator.xr.isSessionSupported) return;
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
      if (!ok) return;
      [b, bt].forEach(function (x) { if (x) { x.hidden = false; x.onclick = function () { document.querySelector('a-scene').enterVR(); }; } });
    }).catch(function () { /* sem suporte: o botão continua oculto */ });
  }

  // ---------------------------------------------------------------- modo foto (renders para o vídeo EAD e os slides)
  function modoFoto(nome) {
    painel.innerHTML = ''; fecharSobre();
    var rot = qs.get('rotulos') === '1';
    CENA.mostrar('dupla', false); CENA.mostrar('comitiva', false); CENA.mostrar('moradores_ps', false); CENA.mostrar('equipe', false);
    CENA.travessia(0, 10); CENA.ruaAlagada(0, 10); CENA.sarjeta(0, 10); CENA.neblina(0); CENA.chuva(0.6); CENA.corrego(-0.85, 10);
    var F = {
      geral: function () { CENA.vista('geral'); CENA.luz(0.12); CENA.mostrar('equipe', true); return ['corrego', 'rua_corrego', 'rua_cima', 'casa_celeste', 'travessia', 'ponto_seco']; },
      corrego_baixo: function () { CENA.vista('corrego'); CENA.luz(0.2); CENA.corrego(yCorrego(2), 10); return ['regua_corrego']; },
      corrego_alerta: function () { CENA.vista('corrego'); CENA.luz(0.4); CENA.chuva(0.9); CENA.corrego(yCorrego(MIN_ALERTA + 3), 10); return ['regua_corrego']; },
      regua: function () { CENA.vista('regua'); CENA.luz(0.35); return ['m15', 'm30', 'm60']; },
      celeste: function () { CENA.vista('celeste'); CENA.luz(0.45); CENA.chuva(0.75); return ['celeste', 'pipoca', 'm15', 'm30', 'm60']; },
      valdir: function () { CENA.vista('valdir'); CENA.luz(0.45); CENA.mostrar('dupla', true); CENA.mostrar('cadeira', true); return ['valdir']; },
      travessia: function () { CENA.vista('trecho2'); CENA.luz(0.6); CENA.chuva(0.9); CENA.travessia(0.2, 10); CENA.comitivaEm(PR.trechos[1].comitiva, -90); CENA.mostrar('celeste_casa', false); CENA.mostrar('pipoca_casa', false); return ['travessia', 't15', 't30', 't60']; },
      rua_de_cima: function () { CENA.vista('trecho3'); CENA.luz(0.66); CENA.chuva(1); CENA.sarjeta(1, 10); CENA.neblina(0.7); CENA.comitivaEm(PR.trechos[2].comitiva, -90); return ['rua_cima']; },
      ponto_seco: function () { CENA.vista('ponto_seco'); CENA.luz(0.8); CENA.chuva(0.9); CENA.mostrar('moradores_ps', true); CENA.mostrar('equipe', true); CENA.ruaAlagada(0.12, 10); return ['ponto_seco', 'reuniao']; },
      alerta_maximo: function () { CENA.vista('geral'); CENA.luz(0.85); CENA.chuva(1); CENA.corrego(0.1, 10); CENA.ruaAlagada(0.12, 10); CENA.travessia(0.35, 10); CENA.mostrar('moradores_ps', true); return ['corrego', 'rua_corrego', 'travessia', 'ponto_seco']; },
      gameover_cena: function () { CENA.vista('gameover'); CENA.luz(0.6); CENA.chuva(0.9); CENA.travessia(0.2, 10); CENA.comitivaEm(PR.trechos[1].comitiva, -90); CENA.mostrar('celeste_casa', false); CENA.mostrar('pipoca_casa', false); CENA.arrastar(true); return []; }
    };
    var r = (F[nome] || F.geral)();
    CENA.rotulos(rot ? r : []);
    setTimeout(function () { marco('foto_pronta'); }, 1800);
  }

  function iniciarDemo(completa) {
    DEMO = true; DEMO_COMPLETA = !!completa;
    telaAbertura();
    legenda(QUEM, 'O jogo joga sozinho: primeiro com um erro proposital, depois do jeito certo');
    marco('demo_inicio');
    espera(PR.demo.abertura_ms).then(function () { jogar('demo'); });
  }
  function sairDemo() { DEMO = false; legendaEl.hidden = true; legendaEl.innerHTML = ''; }

  // ---------------------------------------------------------------- início
  CENA.pronto(function () {
    var cenaEl = document.querySelector('a-scene');
    // remove o atalho do Inspector do A-Frame (carregaria script de host externo)
    try { cenaEl.removeAttribute('inspector'); } catch (e) { /* ok */ }
    try { if (cenaEl.renderer) cenaEl.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); } catch (e) { /* ok */ }
    $('#carregando').hidden = true;
    if (FOTO) { modoFoto(FOTO); return; }
    if (DEMO) { iniciarDemo(DEMO_COMPLETA); return; }
    telaAbertura();
  });
})();

</script>
